<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- 🎨 ESTILOS PRO -->
<style>
body {
    background: linear-gradient(to right, #667eea, #764ba2);
    font-family: Arial, sans-serif;
}

.card {
    border-radius: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.03);
}

.btn {
    border-radius: 10px;
    font-weight: bold;
}

.navbar-brand {
    font-weight: bold;
    font-size: 20px;
}

footer {
    margin-top: 50px;
}
</style>

</head>

<body>

<!-- 🔝 NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand d-flex align-items-center" href="index.html">
    🧭 OrientaT
</a>

<div>
<a class="btn btn-outline-light me-2" href="areas.html">Áreas</a>
<a class="btn btn-outline-light me-2" href="test.html">Test</a>
<a class="btn btn-outline-light" href="contacto.html">Contacto</a>
</div>
</div>
</nav>

<!-- 📩 FORMULARIO -->
<div class="container mt-5 d-flex justify-content-center">

<div class="card p-4 shadow-lg" style="max-width: 500px; width:100%;">

<h3 class="text-center mb-3">📩 Contáctanos</h3>

<form onsubmit="enviarMensaje(event)">

<div class="mb-3">
<label class="form-label">Nombre</label>
<input type="text" class="form-control" placeholder="Ingresa tu nombre" required>
</div>

<div class="mb-3">
<label class="form-label">Correo</label>
<input type="email" class="form-control" placeholder="Ingresa tu correo" required>
</div>

<div class="mb-3">
<label class="form-label">Mensaje</label>
<textarea class="form-control" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
</div>

<button class="btn btn-primary w-100 shadow">
Enviar mensaje
</button>

</form>

<div id="mensajeEnviado" class="mt-3"></div>

<small class="text-muted text-center d-block mt-2">
Este formulario es demostrativo (no envía correos reales)
</small>

</div>

</div>

<!-- 🔻 FOOTER -->
<footer class="bg-dark text-white text-center p-3">
Proyecto escolar - Orientación Vocacional
</footer>

<!-- ⚙️ SCRIPT -->
<script>
function enviarMensaje(e){
e.preventDefault();

document.getElementById("mensajeEnviado").innerHTML =
`<div class="alert alert-success text-center">
✅ Mensaje enviado correctamente
</div>`;
}
</script>

</body>
</html>
