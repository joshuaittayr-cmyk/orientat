<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 🎨 Estilo -->
    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }
    </style>
</head>

<body>

<!-- 🔝 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">OrientaT</a>

    <div>
      <a class="btn btn-outline-light me-2" href="areas.html">Áreas</a>
      <a class="btn btn-outline-light me-2" href="test.html">Test</a>
      <a class="btn btn-outline-light" href="contacto.html">Contacto</a>
    </div>
  </div>
</nav>

<!-- 📩 FORMULARIO -->
<div class="container mt-5 d-flex justify-content-center">

<div class="card p-4 shadow" style="max-width: 500px; width:100%;">

<h3 class="text-center mb-3">Contáctanos</h3>

<form onsubmit="enviarMensaje(event)">

<div class="mb-3">
<label>Nombre</label>
<input type="text" id="nombre" class="form-control" required>
</div>

<div class="mb-3">
<label>Correo</label>
<input type="email" id="correo" class="form-control" required>
</div>

<div class="mb-3">
<label>Mensaje</label>
<textarea id="mensaje" class="form-control" rows="4" required></textarea>
</div>

<button class="btn btn-primary w-100">
Enviar
</button>

</form>

<div id="mensajeEnviado" class="mt-3"></div>

<small class="text-muted text-center d-block mt-2">
Este formulario es solo demostrativo
</small>

</div>

</div>

<!-- 🔻 FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
    Proyecto escolar - Orientación Vocacional
</footer>

<!-- ⚙️ SCRIPT -->
<script>
function enviarMensaje(event) {
    event.preventDefault();

    document.getElementById("mensajeEnviado").innerHTML = `
    <div class="alert alert-success">
        ✅ Tu mensaje fue enviado correctamente
    </div>`;
}
</script>

</body>
</html>
