<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Vocacional</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #667eea, #764ba2);
    color: white;
}

.card {
    border-radius: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.02);
}

.btn-option {
    width: 100%;
    margin-top: 10px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="index.html">🧭 OrientaT</a>
</div>
</nav>

<div class="container mt-5">

<div class="card p-4 shadow text-dark">

<h3 class="text-center mb-4">🧠 Test Vocacional</h3>

<form id="testForm">

<!-- PREGUNTA 1 -->
<p>1. ¿Qué actividad disfrutas más?</p>
<button type="button" class="btn btn-outline-primary btn-option" onclick="responder('tecnologia')">💻 Programar o usar tecnología</button>
<button type="button" class="btn btn-outline-primary btn-option" onclick="responder('salud')">🏥 Ayudar a personas</button>
<button type="button" class="btn btn-outline-primary btn-option" onclick="responder('arte')">🎨 Dibujar o crear</button>

<!-- PREGUNTA 2 -->
<p class="mt-4">2. ¿Qué te interesa más?</p>
<button type="button" class="btn btn-outline-primary btn-option" onclick="responder('tecnologia')">🤖 Innovación</button>
<button type="button" class="btn btn-outline-primary btn-option" onclick="responder('salud')">🧬 Biología</button>
<button type="button" class="btn btn-outline-primary btn-option" onclick="responder('arte')">🎭 Expresión artística</button>

<!-- PREGUNTA 3 -->
<p class="mt-4">3. ¿Cómo te describes?</p>
<button type="button" class="btn btn-outline-primary btn-option" onclick="responder('tecnologia')">🔍 Analítico</button>
<button type="button" class="btn btn-outline-primary btn-option" onclick="responder('salud')">🤝 Empático</button>
<button type="button" class="btn btn-outline-primary btn-option" onclick="responder('arte')">✨ Creativo</button>

</form>

<div class="text-center mt-4">
<button class="btn btn-success" onclick="verResultado()">Ver resultado</button>
</div>

</div>

</div>

<script>
let respuestas = [];

function responder(area){
    respuestas.push(area);
}

function verResultado(){
    let conteo = {
        tecnologia: 0,
        salud: 0,
        arte: 0
    };

    respuestas.forEach(r => conteo[r]++);

    let resultado = Object.keys(conteo).reduce((a, b) => conteo[a] > conteo[b] ? a : b);

    localStorage.setItem("resultado", resultado);

    window.location.href = "resultado.html";
}
</script>

</body>
</html>
