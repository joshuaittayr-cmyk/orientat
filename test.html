<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Vocacional</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #667eea, #764ba2);
    color: white;
}

.container-box {
    background: rgba(255,255,255,0.1);
    padding: 30px;
    border-radius: 15px;
    margin-top: 50px;
}

.btn-option {
    display: block;
    width: 100%;
    margin: 10px 0;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand d-flex align-items-center" href="index.html">
    <img src="logo.PNG" width="50" class="me-2" style="border-radius:10px;">
    OrientaT
</a>
</div>
</nav>

<div class="container">

<div class="container-box text-center">

<h2 id="pregunta">Pregunta</h2>

<div id="opciones"></div>

<button onclick="siguientePregunta()" class="btn btn-light mt-3">
Siguiente
</button>

</div>

</div>

<script>

// AREAS
let puntos = {
    tecnologia: 0,
    salud: 0,
    arte: 0,
    negocios: 0,
    deportes: 0
};

// BONUS si viene de areas
let areaGuardada = localStorage.getItem("areaSeleccionada");
if(areaGuardada){
    puntos[areaGuardada] += 2;
}

// PREGUNTAS
let preguntas = [
{
pregunta: "¿Que actividad disfrutas mas?",
opciones: [
{texto:"Programar o usar tecnologia", area:"tecnologia"},
{texto:"Ayudar personas", area:"salud"},
{texto:"Dibujar o crear", area:"arte"},
{texto:"Vender o liderar", area:"negocios"},
{texto:"Hacer ejercicio", area:"deportes"}
]
},
{
pregunta: "¿Como te describen?",
opciones: [
{texto:"Logico", area:"tecnologia"},
{texto:"Empatico", area:"salud"},
{texto:"Creativo", area:"arte"},
{texto:"Lider", area:"negocios"},
{texto:"Activo", area:"deportes"}
]
},
{
pregunta: "¿Que te gusta ver?",
opciones: [
{texto:"Innovaciones tecnologicas", area:"tecnologia"},
{texto:"Temas de salud", area:"salud"},
{texto:"Arte o diseño", area:"arte"},
{texto:"Negocios o dinero", area:"negocios"},
{texto:"Deportes", area:"deportes"}
]
},
{
pregunta: "¿Que prefieres hacer en tu tiempo libre?",
opciones: [
{texto:"Programar", area:"tecnologia"},
{texto:"Cuidar a otros", area:"salud"},
{texto:"Crear contenido", area:"arte"},
{texto:"Emprender", area:"negocios"},
{texto:"Entrenar", area:"deportes"}
]
},
{
pregunta: "¿Que te motiva?",
opciones: [
{texto:"Innovar", area:"tecnologia"},
{texto:"Ayudar", area:"salud"},
{texto:"Expresarte", area:"arte"},
{texto:"Ganar dinero", area:"negocios"},
{texto:"Competir", area:"deportes"}
]
}
];

// CONTROL
let index = 0;
let seleccion = null;

function mostrarPregunta(){
    let p = preguntas[index];
    document.getElementById("pregunta").innerText = p.pregunta;

    let opcionesHTML = "";

    p.opciones.forEach((op, i)=>{
        opcionesHTML += `
        <button class="btn btn-outline-light btn-option"
        onclick="seleccionar('${op.area}')">
        ${op.texto}
        </button>
        `;
    });

    document.getElementById("opciones").innerHTML = opcionesHTML;
}

function seleccionar(area){
    seleccion = area;
}

function siguientePregunta(){

    if(!seleccion){
        alert("Selecciona una opcion");
        return;
    }

    puntos[seleccion]++;

    seleccion = null;
    index++;

    if(index < preguntas.length){
        mostrarPregunta();
    }else{
        mostrarResultado();
    }
}

function mostrarResultado(){

    let resultado = Object.keys(puntos).reduce((a,b)=>
        puntos[a] > puntos[b] ? a : b
    );

    let texto = "";

    switch(resultado){
        case "tecnologia":
            texto = "Te orientas a Tecnologia 💻";
            break;
        case "salud":
            texto = "Te orientas a Salud 🏥";
            break;
        case "arte":
            texto = "Te orientas a Arte 🎨";
            break;
        case "negocios":
            texto = "Te orientas a Negocios 💼";
            break;
        case "deportes":
            texto = "Te orientas a Deportes ⚽";
            break;
    }

    document.querySelector(".container-box").innerHTML = `
        <h2>${texto}</h2>
        <p class="mt-3">Esta area coincide con tus intereses</p>
        <a href="areas.html" class="btn btn-light mt-3">Ver Areas</a>
    `;
}

// INICIO
mostrarPregunta();

</script>

</body>
</html>
