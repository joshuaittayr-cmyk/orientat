<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Vocacional</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">OrientaT</a>

    <div>
      <a class="btn btn-outline-light me-2" href="areas.html">Áreas</a>
      <a class="btn btn-outline-light" href="contacto.html">Contacto</a>
    </div>
  </div>
</nav>

<div class="container mt-5">

<h2 class="text-center">Test Vocacional</h2>

<form id="testForm">

    <!-- Pregunta 1 -->
    <div class="mb-3">
        <label>1. Me gusta resolver problemas matemáticos</label><br>
        <input type="radio" name="p1" value="1"> 1
        <input type="radio" name="p1" value="2"> 2
        <input type="radio" name="p1" value="3"> 3
        <input type="radio" name="p1" value="4"> 4
        <input type="radio" name="p1" value="5"> 5
    </div>

    <!-- Pregunta 2 -->
    <div class="mb-3">
        <label>2. Me interesa ayudar a las personas</label><br>
        <input type="radio" name="p2" value="1"> 1
        <input type="radio" name="p2" value="2"> 2
        <input type="radio" name="p2" value="3"> 3
        <input type="radio" name="p2" value="4"> 4
        <input type="radio" name="p2" value="5"> 5
    </div>

    <button type="button" class="btn btn-success" onclick="calcular()">Ver resultados</button>

</form>

<script>
function calcular() {

    let total = 0;

    let p1 = document.querySelector('input[name="p1"]:checked');
    let p2 = document.querySelector('input[name="p2"]:checked');

    if (!p1 || !p2) {
        alert("Contesta todas las preguntas");
        return;
    }

    total += parseInt(p1.value);
    total += parseInt(p2.value);

    // Guardar resultado
    localStorage.setItem("resultado", total);

    // Ir a resultados
    window.location.href = "resultados.html";
}
</script>

</body>
</html>
