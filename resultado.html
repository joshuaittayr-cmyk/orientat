<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #667eea, #764ba2);
    color: white;
    text-align: center;
}

.card {
    border-radius: 20px;
    animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

.emoji {
    font-size: 60px;
}

.logo {
    width: 120px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container mt-5">

<div class="card p-5 shadow text-dark">

<!-- LOGO -->
<img src="logo.PNG" class="logo">

<div id="resultado"></div>

<!-- BOTONES -->
<div class="mt-4">
    <button class="btn btn-primary me-2" onclick="reiniciar()">🔄 Volver a intentar</button>
    <button class="btn btn-secondary" onclick="inicio()">🏠 Inicio</button>
</div>

</div>

</div>

<script>

let resultado = localStorage.getItem("resultado");

let contenido = "";

/* TECNOLOGÍA */
if(resultado === "tecnologia"){
contenido = `
<div class="emoji">💻🚀</div>
<h2>ERES TECNOLOGÍA</h2>
<p>Te gusta la tecnología, resolver problemas y crear cosas digitales.</p>

<h4>🎓 Carreras:</h4>
<ul>
<li>Ingeniería en Sistemas</li>
<li>Software</li>
<li>Ciberseguridad</li>
</ul>
`;
}

/* SALUD */
else if(resultado === "salud"){
contenido = `
<div class="emoji">🏥❤️</div>
<h2>ERES SALUD</h2>
<p>Te interesa ayudar a las personas y el bienestar.</p>

<h4>🎓 Carreras:</h4>
<ul>
<li>Medicina</li>
<li>Enfermería</li>
<li>Psicología</li>
</ul>
`;
}

/* ARTE */
else if(resultado === "arte"){
contenido = `
<div class="emoji">🎨✨</div>
<h2>ERES ARTE</h2>
<p>Eres creativo y te gusta expresarte.</p>

<h4>🎓 Carreras:</h4>
<ul>
<li>Diseño Gráfico</li>
<li>Animación</li>
<li>Audiovisual</li>
</ul>
`;
}

/* NEGOCIOS */
else if(resultado === "negocios"){
contenido = `
<div class="emoji">💼📈</div>
<h2>ERES NEGOCIOS</h2>
<p>Tienes habilidades de liderazgo y te interesa emprender.</p>

<h4>🎓 Carreras:</h4>
<ul>
<li>Administración</li>
<li>Marketing</li>
<li>Finanzas</li>
</ul>
`;
}

/* DEPORTES */
else if(resultado === "deportes"){
contenido = `
<div class="emoji">🏅💪</div>
<h2>ERES DEPORTES</h2>
<p>Eres activo y te gusta el esfuerzo físico.</p>

<h4>🎓 Carreras:</h4>
<ul>
<li>Educación Física</li>
<li>Entrenador</li>
<li>Fisioterapia</li>
</ul>
`;
}

/* SI FALLA */
else{
contenido = `
<h2>Error 😅</h2>
<p>Vuelve a hacer el test.</p>
`;
}

document.getElementById("resultado").innerHTML = contenido;

/* FUNCIONES */
function reiniciar(){
    localStorage.clear();
    window.location.href = "test.html";
}

function inicio(){
    window.location.href = "index.html";
}

</script>

</body>
</html>
