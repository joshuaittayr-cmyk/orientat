<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #667eea, #764ba2);
    color: white;
    text-align: center;
}

.card {
    border-radius: 20px;
    animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

.emoji {
    font-size: 60px;
}

.logo {
    width: 120px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container mt-5">

<div class="card p-5 shadow text-dark">

<!-- LOGO -->
<img src="logo.PNG" class="logo">

<div id="resultado"></div>

<button class="btn btn-primary mt-4" onclick="reiniciar()">🔄 Volver a intentar</button>

</div>

</div>

<script>
let resultado = localStorage.getItem("resultado");

let contenido = "";

/* TECNOLOGÍA */
if(resultado === "tecnologia"){
    contenido = `
    <div class="emoji">💻🚀</div>
    <h2>ERES TECNOLOGÍA</h2>
    <p>Te encanta resolver problemas, usar computadoras y crear soluciones digitales.</p>

    <h4>🎓 Carreras recomendadas:</h4>
    <ul>
        <li>Ingeniería en Sistemas</li>
        <li>Desarrollo de Software</li>
        <li>Ciberseguridad</li>
    </ul>

    <h4>💡 Consejo:</h4>
    <p>Empieza creando páginas web o aprendiendo programación.</p>
    `;
}

/* SALUD */
else if(resultado === "salud"){
    contenido = `
    <div class="emoji">🏥❤️</div>
    <h2>ERES SALUD</h2>
    <p>Tienes vocación de ayudar y te interesa el bienestar de las personas.</p>

    <h4>🎓 Carreras recomendadas:</h4>
    <ul>
        <li>Medicina</li>
        <li>Enfermería</li>
        <li>Psicología</li>
    </ul>

    <h4>💡 Consejo:</h4>
    <p>Refuerza biología y química.</p>
    `;
}

/* ARTE */
else if(resultado === "arte"){
    contenido = `
    <div class="emoji">🎨✨</div>
    <h2>ERES ARTE</h2>
    <p>Eres creativo, te gusta expresarte y crear cosas únicas.</p>

    <h4>🎓 Carreras recomendadas:</h4>
    <ul>
        <li>Diseño Gráfico</li>
        <li>Animación</li>
        <li>Producción Audiovisual</li>
    </ul>

    <h4>💡 Consejo:</h4>
    <p>Practica dibujo y diseño digital.</p>
    `;
}

/* NEGOCIOS */
else if(resultado === "negocios"){
    contenido = `
    <div class="emoji">💼📈</div>
    <h2>ERES NEGOCIOS</h2>
    <p>Tienes habilidades de liderazgo y te interesa el mundo empresarial.</p>

    <h4>🎓 Carreras recomendadas:</h4>
    <ul>
        <li>Administración de Empresas</li>
        <li>Marketing</li>
        <li>Contaduría</li>
    </ul>

    <h4>💡 Consejo:</h4>
    <p>Aprende sobre emprendimiento y finanzas.</p>
    `;
}

/* DEPORTES */
else if(resultado === "deportes"){
    contenido = `
    <div class="emoji">🏅💪</div>
    <h2>ERES DEPORTES</h2>
    <p>Eres activo, te gusta el movimiento y el esfuerzo físico.</p>

    <h4>🎓 Carreras recomendadas:</h4>
    <ul>
        <li>Educación Física</li>
        <li>Entrenador Deportivo</li>
        <li>Fisioterapia</li>
    </ul>

    <h4>💡 Consejo:</h4>
    <p>Entrena constantemente y aprende sobre el cuerpo humano.</p>
    `;
}

/* DEFAULT (ANTI ERROR) */
else{
    contenido = `
    <h2>Error 😅</h2>
    <p>No se pudo cargar el resultado. Intenta de nuevo.</p>
    `;
}

document.getElementById("resultado").innerHTML = contenido;

function reiniciar(){
    localStorage.clear();
    window.location.href = "test.html";
}
</script>

</body>
</html>
