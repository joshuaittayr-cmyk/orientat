<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #667eea, #764ba2);
    color: white;
    text-align: center;
}

.card {
    border-radius: 20px;
    animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

.emoji {
    font-size: 60px;
}

</style>
</head>

<body>

<div class="container mt-5">

<div class="card p-5 shadow text-dark">

<div id="resultado"></div>

<button class="btn btn-primary mt-4" onclick="reiniciar()">🔄 Volver a intentar</button>

</div>

</div>

<script>
let resultado = localStorage.getItem("resultado");

let contenido = "";

if(resultado === "tecnologia"){
    contenido = `
    <div class="emoji">💻🚀</div>
    <h2>ERES TECNOLOGÍA</h2>
    <p>Te encanta resolver problemas, usar computadoras y crear soluciones digitales.</p>

    <h4>🎓 Carreras recomendadas:</h4>
    <ul>
        <li>Ingeniería en Sistemas</li>
        <li>Desarrollo de Software</li>
        <li>Ciberseguridad</li>
    </ul>

    <h4>💡 Consejo:</h4>
    <p>Empieza creando páginas web o aprendiendo programación (HTML, JavaScript, Python).</p>
    `;
}

else if(resultado === "salud"){
    contenido = `
    <div class="emoji">🏥❤️</div>
    <h2>ERES SALUD</h2>
    <p>Tienes vocación de ayudar y te interesa el bienestar de las personas.</p>

    <h4>🎓 Carreras recomendadas:</h4>
    <ul>
        <li>Medicina</li>
        <li>Enfermería</li>
        <li>Psicología</li>
    </ul>

    <h4>💡 Consejo:</h4>
    <p>Refuerza materias como biología y química, y busca aprender sobre el cuerpo humano.</p>
    `;
}

else if(resultado === "arte"){
    contenido = `
    <div class="emoji">🎨✨</div>
    <h2>ERES ARTE</h2>
    <p>Eres creativo, te gusta expresarte y crear cosas únicas.</p>

    <h4>🎓 Carreras recomendadas:</h4>
    <ul>
        <li>Diseño Gráfico</li>
        <li>Animación</li>
        <li>Producción Audiovisual</li>
    </ul>

    <h4>💡 Consejo:</h4>
    <p>Practica dibujo, edición o diseño digital usando herramientas como Photoshop o Illustrator.</p>
    `;
}

document.getElementById("resultado").innerHTML = contenido;

function reiniciar(){
    localStorage.clear();
    window.location.href = "test.html";
}
</script>

</body>
</html>
